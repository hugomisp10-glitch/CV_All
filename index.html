<div class="blk"><h3>💊 Alergias e medicação</h3><textarea id="alg" placeholder="Nome, alergias, medicação…">${esc(S.info.alg||'')}</textarea></div>
<div class="blk"><h3>🗣️ Para mostrar (português)</h3><div class="pl">${A.map(x=>`<div class="pc"><div class="pn" style="font-size:17px">${x}</div><span class="ck" style="width:36px;height:36px" onclick="__say(${JSON.stringify(x).replace(/"/g,'&quot;')},'pt')">🔊</span></div>`).join('')}</div><div class="note">O português é língua oficial em Cabo Verde. Peçam ao hotel os números de emergência atualizados.</div></div></div>`);
$('alg').oninput=e=>{S.info.alg=e.target.value;save()};
const R=110.265,pr=$('pratico').querySelector('.blk');
pr.insertAdjacentHTML('beforebegin',`<div class="blk"><h3>💶 Euros ↔ escudos</h3><p class="lead">Câmbio fixo de cerca de 110,265 escudos por euro (confirmar).</p><input class="sel" id="ceu" type="number" step="0.01" placeholder="Euros"><input class="sel" id="ccv" type="number" step="1" placeholder="Escudos cabo-verdianos"></div>`);
$('ceu').oninput=e=>{$('ccv').value=e.target.value?Math.round(e.target.value*R):''};$('ccv').oninput=e=>{$('ceu').value=e.target.value?(e.target.value/R).toFixed(2):''};
const tabs=$('tabs'),mk=(p,t)=>{const b=document.createElement('button');b.className='tab';b.dataset.p=p;b.textContent=t;return b};
tabs.insertAdjacentElement('afterbegin',mk('hoje','📅 Hoje'));tabs.insertBefore(mk('sos','🆘 SOS'),tabs.querySelector('[data-p=pratico]'));
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){const t=document.querySelector('.tab[data-p='+g.dataset.go+']');if(t)t.click()}});
document.querySelector('.tab[data-p=hoje]').click();})();
</script><script>
/* ---- calendário (.ics), partilha e reservas offline ---- */
(()=>{const pad=n=>String(n).padStart(2,'0'),X=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
const DL=[['20270220','Seguro de viagem','Contratar o seguro com assistência médica.'],['20270308','Preparar a viagem','Farmácia, dinheiro, roaming ou eSIM e previsão do tempo.'],['20270317','EASE e TSA','Fazer o registo online e pagar a taxa (recomendado pelo menos 5 dias antes).'],['20270320','Check-in e PDFs offline','Check-in online, PDFs offline e power banks carregados.']];
const ics=()=>{const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ilha do Sal Guia//PT','CALSCALE:GREGORIAN'];
const add=(u,sum,desc,st,en,allday)=>{L.push('BEGIN:VEVENT','UID:'+u+'@sal-guia','DTSTAMP:'+stamp,allday?'DTSTART;VALUE=DATE:'+st:'DTSTART:'+st,allday?'DTEND;VALUE=DATE:'+en:'DTEND:'+en,'SUMMARY:'+X(sum),'DESCRIPTION:'+X(desc),'END:VEVENT')};
DAYS.forEach((dy,di)=>{const day=22+di,date='202703'+pad(day),nx='202703'+pad(day+1),free=[];
dy[4].forEach((a,i)=>{const m=/^~?(\d{1,2}):(\d{2})$/.exec(a[1]);if(m){const h=+m[1],e=pad(Math.min(h+1,23));add('t'+di+'-'+i,a[2],a[3],date+'T'+pad(h)+m[2]+'00',date+'T'+e+m[2]+'00')}else free.push(a[1]+' · '+a[2]+(a[3]?': '+a[3]:''))});
add('d'+di,dy[1]+' · '+dy[2],free.join('\n'),date,nx,1)});
DL.forEach((x,i)=>add('p'+i,x[1],x[2],x[0],String(+x[0]+1),1));
L.push('END:VCALENDAR');return L.join('\r\n')};
const sum=()=>'Ilha do Sal, 22 a 28 de março de 2027 (Hotel Oásis Belorizonte)\n'+DAYS.map(d=>d[1]+': '+d[2]).join('\n');
$('preparar').querySelector('.blk').insertAdjacentHTML('beforebegin',`<div class="blk"><h3>📆 Calendário e partilha</h3><button class="gob" id="cal" style="width:100%;margin:0 0 8px">⬇️ Descarregar calendário (.ics)</button><button class="gob" id="wa" style="width:100%;margin:0 0 8px">💬 Partilhar resumo por WhatsApp</button><div class="note">As horas ficam sem fuso horário (hora local). O calendário inclui o roteiro e os prazos de preparação.</div></div>
<div class="blk"><h3>📎 Reservas offline</h3><p class="lead">Guardem PDFs ou fotos das reservas neste aparelho para as ver sem rede. Não saem do telemóvel.</p><input type="file" id="df" multiple accept="application/pdf,image/*" class="sel"><div id="dl"></div></div>`);
$('cal').onclick=()=>{const b=new Blob([ics()],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ilha-do-sal-2027.ics';document.body.appendChild(a);a.click();a.remove()};
$('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(sum()),'_blank');
const db=new Promise(r=>{try{const q=indexedDB.open('sal-docs',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const tx=(m,fn)=>db.then(d=>d?new Promise(r=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r(null)}):null);
const list=()=>tx('readonly',o=>o.getAll()).then(a=>{a=a||[];$('dl').innerHTML=a.length?'<div class="pl">'+a.map(x=>`<div class="pc"><div><div class="pn">${esc(x.name)}</div><div class="pd">${Math.round(x.blob.size/1024)} KB</div></div><span class="ck" data-o="${x.id}" style="width:36px;height:36px">📂</span><span class="ck" data-x="${x.id}" style="width:36px;height:36px;border-color:#c3564f;color:#c3564f">×</span></div>`).join('')+'</div>':''});
$('df').onchange=async e=>{for(const fl of e.target.files){if(fl.size>15*1048576){alert(fl.name+' tem mais de 15 MB e não foi guardado.');continue}await tx('readwrite',o=>o.put({id:Date.now()+Math.random(),name:fl.name,blob:fl}))}e.target.value='';list()};
$('dl').onclick=async e=>{const o=e.target.closest('[data-o]'),x=e.target.closest('[data-x]');
if(o){const a=await tx('readonly',s=>s.getAll());const r=(a||[]).find(z=>String(z.id)==o.dataset.o);if(r)window.open(URL.createObjectURL(r.blob),'_blank')}
if(x&&confirm('Apagar este ficheiro?')){await tx('readwrite',s=>s.delete(+x.dataset.x));list()}};
list()})();
</script></body></html>
