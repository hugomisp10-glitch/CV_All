<div class="blk"><h3>✈️ Voos, alojamento e carro</h3>${F.map(x=>`<label class="lead" style="display:block;margin:8px 0 3px">${x[1]}</label><input class="sel" data-i="${x[0]}" value="${esc(S.info[x[0]]||'')}">`).join('')}</div>
<div class="blk"><h3>💶 Despesas do grupo</h3><label class="lead" style="display:block;margin:4px 0 3px">Pessoas (separadas por vírgula)</label><input class="sel" id="gp" placeholder="Ana, Rui, Inês…" value="${esc(S.gx.people)}">
<input class="sel" id="gd" placeholder="Descrição (ex.: combustível)"><input class="sel" id="gv" type="number" step="0.01" placeholder="Valor em €"><select class="sel" id="gw"></select><button class="tab on" id="ga" style="width:100%">+ Adicionar despesa</button>
<div id="gl" style="margin-top:12px"></div><div id="gb"></div></div></div>`;
$('pratico').insertAdjacentHTML('beforebegin',html);
const b=document.createElement('button');b.className='tab';b.dataset.p='grupo';b.textContent='Grupo';$('tabs').insertBefore(b,$('tabs').querySelector('[data-p=pratico]'));
document.querySelectorAll('#grupo [data-i]').forEach(i=>i.oninput=()=>{S.info[i.dataset.i]=i.value;save()});
const P=()=>$('gp').value.split(',').map(x=>x.trim()).filter(Boolean),eur=n=>n.toFixed(2).replace('.',',')+'€';
function r(){const p=P();S.gx.people=$('gp').value;save();$('gw').innerHTML=p.map(x=>`<option>${esc(x)}</option>`).join('')||'<option value="">Quem pagou?</option>';
$('gl').innerHTML=S.gx.list.length?'<div class="pl">'+S.gx.list.map((e,i)=>`<div class="pc"><div><div class="pn">${esc(e.d)}</div><div class="pd">Pago por ${esc(e.w)}</div></div><span class="pp">${eur(e.v)}</span><span class="ck" data-x="${i}" style="border-color:#c3564f;color:#c3564f">×</span></div>`).join('')+'</div>':'';
if(!p.length||!S.gx.list.length){$('gb').innerHTML='';return}
const tot=S.gx.list.reduce((a,e)=>a+e.v,0),sh=tot/p.length,bal={};p.forEach(x=>bal[x]=-sh);S.gx.list.forEach(e=>{if(e.w in bal)bal[e.w]+=e.v});
const cr=p.filter(x=>bal[x]>.005).map(x=>[x,bal[x]]).sort((a,c)=>c[1]-a[1]),db=p.filter(x=>bal[x]<-.005).map(x=>[x,-bal[x]]).sort((a,c)=>c[1]-a[1]),t=[];
while(cr.length&&db.length){const m=Math.min(cr[0][1],db[0][1]);t.push(`${esc(db[0][0])} paga ${eur(m)} a ${esc(cr[0][0])}`);cr[0][1]-=m;db[0][1]-=m;if(cr[0][1]<.005)cr.shift();if(db[0][1]<.005)db.shift()}
$('gb').innerHTML=`<div class="note"><b>Total ${eur(tot)} · ${eur(sh)} por pessoa</b>${t.length?'<br>'+t.join('<br>'):'<br>Tudo acertado.'}</div>`}
$('gp').oninput=r;$('ga').onclick=()=>{const d=$('gd').value.trim(),v=parseFloat($('gv').value),w=$('gw').value;if(!d||!(v>0)||!w){alert('Indiquem as pessoas, a descrição, o valor e quem pagou.');return}S.gx.list.push({d,v,w});$('gd').value='';$('gv').value='';r()};
$('gl').onclick=e=>{const x=e.target.closest('[data-x]');if(x){S.gx.list.splice(+x.dataset.x,1);r()}};r();
})();
</script><script>
const BGM=[['Nha Terra','audio/nha-terra.m4a'],['Sodade','audio/sodade.m4a'],['O Nosso Amor','audio/o-nosso-amor.m4a'],['Ningue-m Ningue-m','audio/ningue-m-ningue-m.m4a']];
(()=>{const A=new Audio();A.loop=true;let cur=-1;
const upd=()=>document.querySelectorAll('.bgm').forEach(b=>{const i=+b.dataset.t,on=cur==i&&!A.paused;b.classList.toggle('on',on);b.textContent=(on?'⏸ ':'▶ ')+BGM[i][0]});
window.__bgm=i=>{if(cur==i&&!A.paused){A.pause();upd();return}if(cur!=i){A.src=BGM[i][1];cur=i}A.play().then(upd).catch(()=>alert('Não foi possível tocar o som. Verifica o volume e tenta outra vez.'));upd()};
A.onpause=A.onplay=upd;
const blk=`<div class="blk" style="margin:0 0 14px"><h3 style="font-size:15px">🎵 Banda sonora da viagem</h3><button class="bgm" data-t="0"></button><button class="bgm" data-t="1"></button><button class="bgm" data-t="2"></button><button class="bgm" data-t="3"></button></div>`;
['d1','d2','d3','d4','d5','d6','d7'].forEach(id=>{const t=document.querySelector('#'+id+' .tl');if(t)t.insertAdjacentHTML('beforebegin',blk)});
document.addEventListener('click',e=>{const b=e.target.closest('.bgm');if(b)window.__bgm(+b.dataset.t)});upd();})();
</script><script>
/* ---- Planear: tempo, sol, excursões, tempos de viagem ---- */
(()=>{const row=(a,b,c)=>`<div class="pc"><div><div class="pn">${a}</div>${b?`<div class="pd">${b}</div>`:''}</div>${c?`<span class="pp">${c}</span>`:''}</div>`;
const EX=[['🚙 Volta à ilha em 4x4 (dia 3)','Monte Leão, Terra Boa, Viana, Espargos, Buracona, Shark Bay, Palmeira e Pedra de Lume. ~8–9 h.','❓ ~40–70€'],['⛵ Catamaran com snorkel (dia 5)','Meio dia no mar. Perguntar sobre tartarugas: a desova é de junho a outubro.','❓ ~35–60€'],['🏘️ Santa Maria a pé (dia 6)','Cais, praça, mercado e almoço fora do resort.','grátis'],['🏄 Opcional: kitesurf em Ponta Preta','Aulas e aluguer; vento forte em março.','❓'],['🐋 Opcional: baleias','Costuma haver época de janeiro a abril; confirmar com operadores.','❓']];
const DR=[['Resort → Aeroporto','~15–17 min'],['Resort → Santa Maria','~5–10 min'],['Resort → Ponta Preta','~5–10 min'],['Resort → Monte Leão','~15 min'],['Resort → Espargos','~20 min'],['Resort → Terra Boa / Viana','~25 min'],['Resort → Pedra de Lume','~30 min'],['Resort → Palmeira / Shark Bay','~30–35 min'],['Resort → Buracona','~35 min']];
const html=`<div class="panel" id="planear"><h2>Planear & imprevistos</h2><p class="lead">Previsão, luz do dia, excursões e tempos de viagem. Valores indicativos: confirmem antes de ir.</p>
<div class="blk"><h3>🌦️ Previsão</h3><div id="wx"><p class="lead">A previsão aparece quando faltarem 16 dias para a viagem.</p></div><div class="note">Em março costuma fazer sol e vento forte, com cerca de 22–26 °C. Fonte: Open-Meteo.</div></div>
<div class="blk"><h3>🌅 Luz do dia em Santa Maria</h3><div class="pl" id="sun"></div></div>
<div class="blk"><h3>🧭 Excursões (3 saídas do resort)</h3><div class="pl">${EX.map(r=>row(r[0],r[1],r[2])).join('')}</div><div class="note">❓ = estimativa não verificada. Reservem com o resort ou operadores locais.</div></div>
<div class="blk"><h3>🚗 Tempos de viagem (aprox.)</h3><div class="pl">${DR.map(r=>row(r[0],'',r[1])).join('')}</div></div>
<div class="blk"><h3>🕐 Hora e documentos</h3><ul><li>Cabo Verde fica 1 h atrás de Portugal até 27 de março, e 2 h atrás a partir de 28 (mudança de hora em Portugal).</li><li>Passaporte válido, registo online (EASE) e taxa de segurança aeroportuária: confirmar regras atuais.</li><li>Seguro de viagem com assistência médica.</li></ul></div></div>`;
$('pratico').insertAdjacentHTML('beforebegin',html);
const b=document.createElement('button');b.className='tab';b.dataset.p='planear';b.textContent='Planear';$('tabs').insertBefore(b,$('tabs').querySelector('[data-p=pratico]'));
const sun=(y,m,d,lat,lon)=>{const r=Math.PI/180,JD=Date.UTC(y,m-1,d)/864e5+2440587.5,n=Math.round(JD-2451545+.0008),J=n-lon/360,M=(357.5291+.98560028*J)%360,C=1.9148*Math.sin(M*r)+.02*Math.sin(2*M*r)+.0003*Math.sin(3*M*r),L=(M+C+180+102.9372)%360,T=2451545+J+.0053*Math.sin(M*r)-.0069*Math.sin(2*L*r),dl=Math.asin(Math.sin(L*r)*Math.sin(23.44*r)),w=Math.acos((Math.sin(-.833*r)-Math.sin(lat*r)*Math.sin(dl))/(Math.cos(lat*r)*Math.cos(dl)))/r/360;return[T-w,T+w]};
const fm=J=>new Date((J-2440587.5)*864e5).toLocaleTimeString('pt-PT',{timeZone:'Atlantic/Cape_Verde',hour:'2-digit',minute:'2-digit'});
$('sun').innerHTML=[22,23,24,25,26,27,28].map(d=>{const[a,c]=sun(2027,3,d,16.6,-22.93),h=(c-a)*24;return row(`${d} mar`,`Nascer ${fm(a)} · Pôr do sol ${fm(c)} (hora local)`,`${Math.floor(h)}h${String(Math.round((h%1)*60)).padStart(2,'0')} de luz`)}).join('');
fetch('https://api.open-meteo.com/v1/forecast?latitude=16.6&longitude=-22.93&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Atlantic%2FCape_Verde&start_date=2027-03-22&end_date=2027-03-28').then(r=>r.json()).then(d=>{if(!d.daily)return;$('wx').innerHTML='<div class="pl">'+d.daily.time.map((t,j)=>row(t.slice(8)+' mar',`Chuva ${d.daily.precipitation_probability_max[j]??'—'}% · vento até ${Math.round(d.daily.wind_speed_10m_max[j])} km/h`,`${Math.round(d.daily.temperature_2m_min[j])}–${Math.round(d.daily.temperature_2m_max[j])}°C`)).join('')+'</div>'}).catch(()=>{});
})();
</script>
<script>

const b=document.createElement('button');b.className='tab';b.dataset.p='extras';b.textContent='Extras';$('tabs').insertBefore(b,$('tabs').querySelector('[data-p=pratico]'));})();
